schema_version: 1

context:
  name: codext
  version: "2.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/codext-${{ version }}.tar.gz
  sha256: 6e10ae3ec00a0d82a865b12d4af8b658a8b90daea587f3e6d414b9759b52e1e9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - base1 = codext.base.baseN:main1
      - base2 = codext.base.baseN:main2
      - base3 = codext.base.baseN:main3
      - base4 = codext.base.baseN:main4
      - base8 = codext.base.baseN:main8
      - base10 = codext.base.baseN:main10
      - base16 = codext.base.baseN:main16
      - base26 = codext.base.baseN:main26
      - base32 = codext.base.baseN:main32
      - base32-hex = codext.base.baseN:main32hex
      - base32-geohash = codext.base.baseN:main32geo
      - base32-crockford = codext.base.baseN:main32crk
      - base32-z = codext.base.baseN:mainz32
      - base36 = codext.base.baseN:main36
      - base38 = codext.base.base38:main38
      - base45 = codext.base.base45:main
      - base58-bitcoin = codext.base.baseN:main58bc
      - base58-ripple = codext.base.baseN:main58rp
      - base58-flickr = codext.base.baseN:main58fl
      - base62 = codext.base.baseN:main62
      - base63 = codext.base.baseN:main63
      - base64 = codext.base.baseN:main64
      - base64-url = codext.base.baseN:main64url
      - base67 = codext.base.baseN:main67
      - base69 = codext.base.base69:main69
      - base85 = codext.base.base85:main85
      - base85-adobe = codext.base.base85:main85adobe
      - base85-xbtoa = codext.base.base85:main85xbtoa
      - base85-ipv6 = codext.base.base85:main85rfc1924
      - base85-xml = codext.base.base85:main85xml
      - base85-zeromq = codext.base.base85:main85zeromq
      - base91 = codext.base.base91:main91
      - base100 = codext.base.base100:main100
      - base122 = codext.base.base122:main122
      - base128-latin1 = codext.base.base128:main128latin1
      - base256 = codext.base.base256:main256
      - base1024 = codext.base.base1024:main1024
      - base2048 = codext.base.base65536:main2048
      - base32768 = codext.base.base65536:main32768
      - base65536 = codext.base.base65536:main65536
      - base131072 = codext.base.base131072:main131072
      - codext = codext.__main__:main
      - unbase = codext.base.__init__:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=80.0.0
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - markdown2 >=2.5.4
    - legacycrypt

tests:
  - python:
      imports:
        - codext
        - codext.base
        - codext.binary
        - codext.common
        # - codext.compressions
        - codext.crypto
        - codext.hashing
        - codext.languages
        - codext.others
        - codext.stegano
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests
    requirements:
      run:
        - openssl
        - pytest
        - python ${{ python_min }}.*
    script:
      - base1 --help
      - base2 --help
      - base3 --help
      - base4 --help
      - base8 --help
      - base10 --help
      - base16 --help
      - base26 --help
      - base32 --help
      - base32-hex --help
      - base32-geohash --help
      - base32-crockford --help
      - base32-z --help
      - base36 --help
      - base38 --help
      - base45 --help
      - base58-bitcoin --help
      - base58-ripple --help
      - base58-flickr --help
      - base62 --help
      - base63 --help
      - base64 --help
      - base64-url --help
      - base67 --help
      # - base69 --help
      - base85 --help
      - base85-adobe --help
      - base85-xbtoa --help
      - base85-ipv6 --help
      - base85-xml --help
      - base85-zeromq --help
      - base91 --help
      - base100 --help
      - base122 --help
      # - base128-latin1 --help
      # - base256 --help
      - base1024 --help
      - base2048 --help
      - base32768 --help
      - base65536 --help
      # - base131072 --help
      - codext --help
      - unbase --help
      - "pytest -vvv --capture=tee-sys -k \"not hash_functions and not codec_base64 and not rank_input and not guess_decode\" tests"

about:
  summary: Native codecs extension
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/dhondta/python-codext
  documentation: https://python-codext.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - thewchan
